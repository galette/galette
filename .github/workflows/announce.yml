name: Announce

# Triggered by the release being published, not by the tag being pushed: at tag
# time the archive is not attached yet, so the announcement would link an empty
# release and the website would name a download that does not exist. This works
# whether the release is created by hand or by a future release workflow — it
# presumes nothing about how the archive is produced.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce'
        required: true
      dry-run:
        description: 'Compose everything, publish and dispatch nothing'
        type: boolean
        default: true

concurrency:
  group: "announce-${{ github.event.release.tag_name || inputs.version }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    # A prerelease is never announced. That is what keeps the rolling `nightly`
    # release of nightly.yml from tooting the first night it is created.
    if: github.repository == 'galette/galette' && github.event.release.prerelease != true

    env:
      APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}

    steps:
      - name: Resolve the version
        id: version
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::'${VERSION}' does not look like a Galette version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry-run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "Announcing Galette ${VERSION} (dry run: ${DRY_RUN})"

      # Scoped to the two repositories it has to knock on. Without owner and
      # repositories the action mints a token for this repository only, and the
      # dispatches below would answer 404.
      - name: Mint a token for website and galettedoc
        id: app-token
        if: env.APP_ID != '' && steps.version.outputs.dry-run != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: galette
          repositories: |
            website
            galettedoc

      # The token only rings the doorbell. Each repository opens its own pull
      # request, with its own workflow, against its own branch.
      - name: Ask website and galettedoc for their version bump
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          for repo in website galettedoc; do
            # Warned about rather than fatal, and one by one: a repository that
            # refuses the event must not cost the other one its pull request, nor
            # the release its announcement.
            if gh api --method POST "repos/galette/${repo}/dispatches" \
                 -f event_type=galette-release \
                 -f "client_payload[version]=${VERSION}" --silent; then
              echo "galette/${repo} has been asked to bump to ${VERSION}."
            else
              echo "::warning::could not dispatch galette-release to galette/${repo}, see the error above. It may mean the app is not installed there, or that the token was not scoped to it. Its version bump will have to be done by hand, or the workflow run from the repository with the version as input."
            fi
          done

      - name: Say why nothing was dispatched
        if: env.APP_ID == '' && steps.version.outputs.dry-run != 'true'
        run: |
          echo "::warning::RELEASE_BOT_APP_ID is not set, so website and galettedoc were not asked to bump to ${{ steps.version.outputs.version }}."

      # A release may ship its own announcement, written in both languages, in
      # .github/announce/<version>.<lang>.txt. It is read from the tag, so what
      # is published is what was reviewed in the release pull request.
      - name: Fetch the announcement texts
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.version }}
          sparse-checkout: .github/announce
          persist-credentials: false

      - name: Read the announcement texts
        id: texts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Both or none: announcing in one language only would be an oversight,
          # not a choice.
          if [[ -f ".github/announce/${VERSION}.en.txt" && -f ".github/announce/${VERSION}.fr.txt" ]]; then
            echo "custom=true" >> "$GITHUB_OUTPUT"
            for lang in en fr; do
              delimiter="EOF_$(openssl rand -hex 8)"
              {
                echo "${lang}<<${delimiter}"
                cat ".github/announce/${VERSION}.${lang}.txt"
                echo "${delimiter}"
              } >> "$GITHUB_OUTPUT"
            done
            echo "Announcing with the texts shipped in .github/announce/"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "No announcement texts for ${VERSION}, the generic one is used."
          fi

      - name: Announce on Mastodon
        if: steps.texts.outputs.custom != 'true'
        uses: galette/.github/actions/toot@main
        with:
          status: |
            Galette ${{ steps.version.outputs.version }} is out!

            ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}
          token: ${{ secrets.MASTODON_TOKEN }}
          instance: ${{ vars.MASTODON_INSTANCE }}
          idempotency-key: galette-${{ steps.version.outputs.version }}
          dry-run: ${{ steps.version.outputs.dry-run }}

      - name: Announce on Mastodon, in English
        if: steps.texts.outputs.custom == 'true'
        uses: galette/.github/actions/toot@main
        with:
          status: ${{ steps.texts.outputs.en }}
          language: en
          token: ${{ secrets.MASTODON_TOKEN }}
          instance: ${{ vars.MASTODON_INSTANCE }}
          idempotency-key: galette-${{ steps.version.outputs.version }}-en
          dry-run: ${{ steps.version.outputs.dry-run }}

      - name: Announce on Mastodon, in French
        if: steps.texts.outputs.custom == 'true'
        uses: galette/.github/actions/toot@main
        with:
          status: ${{ steps.texts.outputs.fr }}
          language: fr
          token: ${{ secrets.MASTODON_TOKEN }}
          instance: ${{ vars.MASTODON_INSTANCE }}
          idempotency-key: galette-${{ steps.version.outputs.version }}-fr
          dry-run: ${{ steps.version.outputs.dry-run }}

      # Only maintainers may post in Announcements, and the workflow token is not
      # one: the release bot posts there. Scoped to this repository, which is the
      # source of the organisation Discussions, and to discussions alone. Allowed
      # to fail: the toots are out already, the discussion step below warns.
      - name: Mint a token for the Discussions
        id: discussions-token
        if: env.APP_ID != '' && steps.version.outputs.dry-run != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: galette
          repositories: galette
          permission-discussions: write

      # The same texts, both languages in one discussion, in the Announcements
      # category of the organisation Discussions. Warned about rather than fatal:
      # the toots are out already, a missing discussion can be posted by hand.
      - name: Announce in the Discussions
        env:
          GH_TOKEN: ${{ steps.discussions-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
          CUSTOM: ${{ steps.texts.outputs.custom }}
          TEXT_EN: ${{ steps.texts.outputs.en }}
          TEXT_FR: ${{ steps.texts.outputs.fr }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}
          # GraphQL ids of galette/galette and of its Announcements category, from
          # `gh api graphql` on repository { id discussionCategories { ... } }.
          REPOSITORY_ID: MDEwOlJlcG9zaXRvcnk3NjE0MjM2
          CATEGORY_ID: DIC_kwDOAHQvHM4DKCSd
        run: |
          # The shell runs with -e: a failing `gh api` must warn, not stop.
          set +e
          set -uo pipefail

          title="Galette ${VERSION} is out"

          # The hashtags line of a toot would be rendered as a Markdown heading.
          strip_hashtags() {
            printf '%s\n' "$1" | grep -Ev '^[[:space:]]*(#[[:alnum:]_]+[[:space:]]*)+$'
          }

          if [ "$CUSTOM" = "true" ]; then
            body="$(strip_hashtags "$TEXT_EN")"$'\n\n---\n\n'"$(strip_hashtags "$TEXT_FR")"
          else
            body="Galette ${VERSION} is out!"
          fi
          body+=$'\n\n---\n\n'"Release: ${RELEASE_URL}"

          echo "Discussion \"${title}\":"
          printf '%s\n' "$body" | sed 's/^/  | /'

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run, no discussion was created."
            exit 0
          fi

          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::no release bot token, see the step above: RELEASE_BOT_APP_ID may be unset, or the app not installed on galette/galette with the Discussions permission. ${VERSION} will have to be announced in the Discussions by hand."
            exit 0
          fi

          # A re-run must not open a second discussion for the same release.
          existing=$(gh api graphql \
            -f query='query($cat: ID!) {
              repository(owner: "galette", name: "galette") {
                discussions(first: 50, categoryId: $cat, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes { title url }
                }
              }
            }' \
            -f cat="$CATEGORY_ID" \
            --jq ".data.repository.discussions.nodes[] | select(.title == \"${title}\") | .url")
          if [ $? -ne 0 ]; then
            echo "::warning::could not list the existing announcements, see the error above. No discussion was created for ${VERSION}, it will have to be posted by hand."
            exit 0
          fi
          if [ -n "$existing" ]; then
            echo "::notice::${VERSION} has been announced in the Discussions already: ${existing}"
            exit 0
          fi

          url=$(gh api graphql \
            -f query='mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repo, categoryId: $cat, title: $title, body: $body}) {
                discussion { url }
              }
            }' \
            -f repo="$REPOSITORY_ID" \
            -f cat="$CATEGORY_ID" \
            -f title="$title" \
            -f body="$body" \
            --jq '.data.createDiscussion.discussion.url')
          if [ $? -ne 0 ] || [ -z "$url" ]; then
            echo "::warning::could not create the announcement discussion, see the error above. It may mean the release bot lacks the Discussions write permission. ${VERSION} will have to be announced there by hand."
            exit 0
          fi

          echo "Published: ${url}"
          {
            echo "### Announced in the Discussions"
            echo
            echo "[${url}](${url})"
          } >> "$GITHUB_STEP_SUMMARY"
