name: Galette E2E Tests

on:
  push:
    branches:
      - master
      - develop
    tags:
      - '*'
  pull_request:
  # Enable manual run
  workflow_dispatch:
  # Run once a month
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    name: Playwright — ${{ matrix.project }} ${{ (matrix.always == false && (github.event_name == 'pull_request' || github.repository != 'galette/galette' || !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')))) && ' (skipped)' || '' }}
    env:
      DB: pgsql
      GALETTE_TESTS: 1
      skip: ${{ matrix.always == false && (github.event_name == 'pull_request' || github.repository != 'galette/galette' || !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags'))) }}

    strategy:
        fail-fast: false
        matrix:
          include:
          #always tests higher stable php version with lower db version
          #enable coverage on higher stable php version with higher PostgreSQL version
          #cache must be disabled on one always enabled build (not coverage one, this already takes much time than others)
          #higher stable php version
            - { project: "a11y", browser: "chromium", always: true }
            - { project: "chromium", browser: "chromium", always: true }
            - { project: "firefox", browser: "firefox", always: false }
            - { project: "webkit", browser: "webkit", always: false }

    services:
      # Label used to access the service container
      db:
        image: postgres:17
        env:
          POSTGRES_USER: galette_tests
          POSTGRES_PASSWORD: g@l3tte
          POSTGRES_DB: galette_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        if: env.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: PHP
        if: env.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer, pecl
          coverage: none
          extensions: apcu, pdo_pgsql
          ini-values: apc.enable_cli=1

      - name: Build Galette
        if: env.skip != 'true'
        uses: galette/.github/actions/build-galette@main
        with:
          php-version: "8.5"
          enable-assets-cache: true
          skip-checkout: true

      - name: Initialize test data
        if: env.skip != 'true'
        run: php tests/init_test_data.php

      - name: Initialize Galette database (PostgreSQL)
        if: env.skip != 'true'
        run: |
          bin/console galette:install -v \
            --dbtype=pgsql \
            --dbhost=localhost \
            --dbname=galette_tests \
            --dbuser=galette_tests \
            --dbpass=g@l3tte \
            --admin=${{ secrets.E2E_ADMIN_USER || 'admin' }} \
            --password=${{ secrets.E2E_ADMIN_PASS || 'admin' }} \
            --no-interaction
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Seed E2E fixtures
        if: env.skip != 'true'
        run: bin/console galette:seed-fixtures -v

      - name: Start PHP built-in server
        if: env.skip != 'true'
        run: |
          php -S 0.0.0.0:8090 -t galette/webroot tests/router_e2e.php &
          # Wait for service being up
          timeout 15 bash -c 'until curl -sf http://127.0.0.1:8090/login > /dev/null; do sleep 1; done'
          echo "PHP server started"


      - name: Install Playwright browsers
        if: env.skip != 'true'
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        if: env.skip != 'true'
        run: |
          npx playwright test --project ${{ matrix.project }}
        env:
          E2E_BASE_URL: http://127.0.0.1:8090
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER || 'admin' }}
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS || 'admin' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test data (logs, photos, etc.)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-data
          path: |
            tests/tests-data/
            galette/data/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          summary-report: true
        if: always()