body:
  - type: markdown
    attributes:
      value: |
        Ask for help installing, upgrading or using Galette.
        Found a bug? Please report it on the [bug tracker](https://bugs.galette.eu/projects/galette) instead.
  - type: input
    id: version
    attributes:
      label: Galette version
      description: Shown at the bottom of every page, or in Configuration > System information.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MariaDB
        - MySQL
        - PostgreSQL
        - I don't know
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3"
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, what did you expect, and what happened? Include error messages and logs if any.
    validations:
      required: true
